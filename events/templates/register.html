<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf3ff, #b9d8ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.25);
        }

        .form-card h1 {
            margin: 0;
            text-align: center;
            color: #1d4ed8;
            font-size: 28px;
        }

        .form-card p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #1e3a8a;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .errorlist {
            margin: 6px 0 0;
            padding-left: 18px;
            color: #dc2626;
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .note {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="form-card">
        <h1>Event Registration</h1>
        <p class="subtitle">Please fill out the form to register for the event.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Register Now</button>
        </form>

        <div class="note">
            Only Gmail accounts are accepted.
        </div>
    </div>
</body>
</html>
