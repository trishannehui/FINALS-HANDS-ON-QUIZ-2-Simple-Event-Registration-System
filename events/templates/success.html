<!DOCTYPE html>
<html>
<head>
    <title>Registration Successful</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f9e9, #a8e6a1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-card {
            width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(34, 197, 94, 0.25);
        }

        .circle {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: #22c55e;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            font-weight: bold;
        }

        h1 {
            color: #15803d;
            margin-bottom: 10px;
        }

        p {
            color: #4b5563;
            font-size: 15px;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #22c55e;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        a:hover {
            background: #15803d;
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="circle">✓</div>

        <h1>Registration Successful</h1>
        <p>Your event registration has been saved successfully.</p>

        <a href="/">Register Another User</a>
    </div>
</body>
</html>
